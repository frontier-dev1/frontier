name: Frontier Discovery

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Incident discovery
      # -------------------------------------------------------

      - name: Run Frontier incident discovery
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.FRONTIER_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://frontier-eight.vercel.app/api/discovery/run

      # -------------------------------------------------------
      # AI news discovery
      # -------------------------------------------------------

      - name: Run Frontier AI news discovery
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.FRONTIER_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://frontier-eight.vercel.app/api/news/discover